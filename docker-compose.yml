x-app-env: &app-env
  CASSANDRA_HOSTS: cassandra
  CASSANDRA_KEYSPACE: fraud_detection
  KAFKA_BOOTSTRAP: kafka:29092
  REDIS_URL: redis://redis:6379/0
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MODEL_ARTIFACTS_DIR: /app/models/artifacts
  JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
  API_URL: http://api:8000

services:
  cassandra:
    image: cassandra:4.1
    container_name: fraud-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: fraud_detection_cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 1024M
    ports: ["9042:9042"]
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local'"]
      interval: 15s
      timeout: 10s
      retries: 15

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    restart: unless-stopped
    depends_on: [zookeeper]
    ports: ["9093:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6380:6379"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    restart: unless-stopped
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [mlflow_data:/mlflow]

  api:
    build: {context: ., dockerfile: docker/Dockerfile}
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      cassandra: {condition: service_healthy}
    ports: ["8000:8000"]
    environment: *app-env
    volumes: [./models/artifacts:/app/models/artifacts]

  consumer:
    build: {context: ., dockerfile: docker/Dockerfile}
    restart: unless-stopped
    command: python -m streaming.consumer
    depends_on:
      cassandra: {condition: service_healthy}
    environment: *app-env
    volumes: [./models/artifacts:/app/models/artifacts]
    ports: ["9100:9100"]

  producer:
    build: {context: ., dockerfile: docker/Dockerfile}
    restart: unless-stopped
    command: python -m streaming.producer --rate 3 --fraud-rate 0.04
    depends_on: [kafka]
    environment: *app-env

  dashboard:
    build: {context: ., dockerfile: docker/Dockerfile}
    restart: unless-stopped
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on: [api]
    ports: ["8501:8501"]
    environment:
      <<: *app-env
      API_URL: http://api:8000
      DASH_USER: admin
      DASH_PASSWORD: admin123

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml]

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports: ["3001:3000"]

volumes:
  cassandra_data:
  mlflow_data:
